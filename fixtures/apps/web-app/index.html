<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northwind Projects</title>
<style>
  :root {
    --bg: #f6f7fb; --surface: #ffffff; --text: #141826; --muted: #5d6478; --accent: #4f46e5;
    --accent-soft: #e9e8fd; --border: #e3e6ef; --ok: #16a34a; --radius: 14px;
  }
  body.broken { --bg: #fff7ed; --accent: #db2777; --accent-soft: #fde2ef; --radius: 2px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 15px/1.45 "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header { height: 64px; display: flex; align-items: center; gap: 32px; padding: 0 40px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .logo { font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
  .logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: inline-block; }
  nav { display: flex; gap: 6px; }
  nav a { padding: 8px 14px; border-radius: 999px; color: var(--muted); text-decoration: none; font-weight: 500; }
  nav a.active { background: var(--accent-soft); color: var(--accent); }
  .avatar { margin-left: auto; width: 34px; height: 34px; border-radius: 50%; background: #c7d2fe; }
  main { padding: 36px 40px; max-width: 1200px; }
  .view { animation: enter 260ms ease-out both; }
  @keyframes enter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; cursor: pointer; transition: box-shadow .2s; }
  .card:hover { box-shadow: 0 6px 24px rgba(20, 24, 38, .08); }
  .card h3 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0 0 18px; color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--border); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; margin-bottom: 14px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 22px; }
  .task { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .task:last-child { border-bottom: 0; }
  .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); }
  .task.done .check { background: var(--ok); border-color: var(--ok); }
  .task.done span { color: var(--muted); text-decoration: line-through; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .row b { display: block; }
  .row small { color: var(--muted); }
  .switch { width: 46px; height: 26px; border-radius: 99px; background: #cbd2e1; position: relative; cursor: pointer; transition: background .25s ease-in-out; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: white; transition: transform .25s ease-in-out; }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(20px); }
  .btn { margin-top: 22px; background: var(--accent); color: white; border: 0; padding: 12px 20px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; }
  .two { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  .stat { font-size: 34px; font-weight: 700; }
</style>
</head>
<body>
<header>
  <div class="logo"><i></i><span id="brand">Northwind</span></div>
  <nav>
    <a href="#/" data-route="/">Projects</a>
    <a href="#/activity" data-route="/activity">Activity</a>
    <a href="#/settings" data-route="/settings">Settings</a>
  </nav>
  <div class="avatar"></div>
</header>
<main id="app"></main>
<script>
  const broken = new URLSearchParams(location.search).has("broken");
  if (broken) document.body.classList.add("broken");
  const projects = [
    { id: "atlas", name: "Atlas redesign", desc: "New marketing site and docs", progress: 72, due: "Due Mar 14", tasks: 18 },
    { id: "harbor", name: "Harbor API", desc: "Public REST API v2", progress: 45, due: "Due Apr 2", tasks: 26 },
    { id: "lumen", name: "Lumen mobile", desc: "iOS and Android apps", progress: 30, due: "Due May 20", tasks: 41 },
  ];
  const views = {
    "/": () => `
      <h1>${broken ? "All work" : "Projects"}</h1>
      <p class="sub">3 active projects · updated 5 minutes ago</p>
      <div class="grid">${projects.slice(0, broken ? 2 : 3).map(p => `
        <div class="card" data-open="${p.id}">
          <h3>${p.name}</h3><p>${p.desc}</p>
          <div class="bar"><span style="width:${p.progress}%"></span></div>
          <div class="meta"><span>${p.progress}% complete</span><span>${p.due}</span></div>
        </div>`).join("")}
      </div>`,
    "/project": (id) => { const p = projects.find(x => x.id === id) || projects[0]; return `
      <span class="pill">In progress</span>
      <h1>${p.name}</h1>
      <p class="sub">${p.desc} · ${p.tasks} tasks</p>
      <div class="two">
        <div class="panel">
          ${["Audit current pages", "Write new homepage copy", "Design component library", "Build pricing page", "Launch checklist"].map((t, i) => `
            <div class="task ${i < 2 ? "done" : ""}"><div class="check"></div><span>${t}</span></div>`).join("")}
        </div>
        <div class="panel" style="padding:22px">
          <small style="color:var(--muted)">Progress</small>
          <div class="stat">${p.progress}%</div>
          <div class="bar" style="margin-top:12px"><span style="width:${p.progress}%"></span></div>
          <p class="sub" style="margin:14px 0 0">${p.due}</p>
        </div>
      </div>`; },
    "/settings": () => `
      <h1>Settings</h1>
      <p class="sub">Manage notifications and workspace preferences</p>
      <div class="panel" style="max-width:640px">
        <div class="row"><div><b>Email digests</b><small>A summary of activity every morning</small></div><div class="switch on" data-toggle></div></div>
        <div class="row"><div><b>Mentions</b><small>Notify me when someone mentions me</small></div><div class="switch" data-toggle id="mentions"></div></div>
        <div class="row"><div><b>Weekly report</b><small>Send project progress every Friday</small></div><div class="switch on" data-toggle></div></div>
      </div>
      <button class="btn">${broken ? "Submit" : "Save changes"}</button>`,
    "/activity": () => `<h1>Activity</h1><p class="sub">Nothing new today</p>`,
  };
  function render() {
    const hash = location.hash.replace(/^#/, "") || "/";
    const [route, arg] = hash.startsWith("/project/") ? ["/project", hash.split("/")[2]] : [hash, null];
    const app = document.getElementById("app");
    app.innerHTML = `<div class="view">${(views[route] || views["/"])(arg)}</div>`;
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.route === route || (route === "/project" && a.dataset.route === "/")));
  }
  document.addEventListener("click", (e) => {
    const card = e.target.closest("[data-open]");
    if (card) location.hash = "#/project/" + card.dataset.open;
    const sw = e.target.closest("[data-toggle]");
    if (sw) sw.classList.toggle("on");
  });
  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
